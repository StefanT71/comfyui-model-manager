; ComfyUI Model Manager - English strings / translation template
;
; To create a new language:
;   1. Copy this file to lang\<code>.ini (for example lang\de.ini).
;   2. Set name= and culture= below.
;   3. Translate the values on the right side of each key.
;   4. Keep placeholders such as {0} and {1} unchanged.
;   5. Use \n for a line break. Save the file as UTF-8.
;
; Missing keys fall back to English. Files whose names start with _ are ignored.
; The English strings are built into the program from this file.

